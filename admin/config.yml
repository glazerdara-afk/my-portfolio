backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

locale: "ru"

collections:
  - name: "site"
    label: "Сайт"
    files:
      - file: "content.json"
        label: "Контент сайта"
        name: "content"
        fields:
          - { label: "Имя / название студии", name: "name", widget: "string" }
          - { label: "Фото на обложке (hero)", name: "hero_image", widget: "image" }
          - { label: "Видео на обложке (необязательно, mp4)", name: "hero_video", widget: "file", required: false, hint: "Если загружено — покажется вместо фото" }
          - label: "Услуги"
            name: "services"
            widget: "list"
            summary: "{{fields.title}} — {{fields.price}}"
            fields:
              - { label: "Метка (например Studio)", name: "label", widget: "string" }
              - { label: "Название услуги", name: "title", widget: "string" }
              - { label: "Описание", name: "description", widget: "text" }
              - { label: "Цена", name: "price", widget: "string" }
          - label: "Галерея (лента фото и видео)"
            name: "gallery"
            widget: "list"
            field: { label: "Фото или видео (mp4)", name: "image", widget: "file", hint: "Можно грузить и картинки, и mp4-видео — сайт сам определит тип" }
          - label: "Кейсы (разбор процесса)"
            name: "case_studies"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "Название кейса", name: "title", widget: "string" }
              - { label: "Краткий бриф", name: "brief", widget: "text", hint: "Что хотел клиент / какая была задача" }
              - label: "Шаги процесса"
                name: "steps"
                widget: "list"
                summary: "{{fields.label}}"
                hint: "Последний шаг в списке автоматически показывается как финальный результат (крупнее, с красной рамкой)"
                fields:
                  - { label: "Подпись (например Draft 1, Final)", name: "label", widget: "string" }
                  - { label: "Изображение", name: "image", widget: "image" }
          - label: "FAQ"
            name: "faq"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Вопрос", name: "question", widget: "string" }
              - { label: "Ответ", name: "answer", widget: "text" }
              - { label: "Фото рядом с ответом", name: "image", widget: "image" }
          - { label: "Текст в разделе Contact", name: "contact_text", widget: "text" }
          - { label: "Ссылка на Instagram", name: "instagram_url", widget: "string" }
          - { label: "Ссылка на Facebook", name: "facebook_url", widget: "string" }

       

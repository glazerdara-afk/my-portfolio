<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jessi Jons — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  :root{
    --bg:#0A0A09;
    --bg-alt:#111110;
    --red:#E63A2E;
    --white:#F4F3EF;
    --grey:#8C8C86;
    --line:rgba(244,243,239,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--white);font-family:'Inter',sans-serif;overflow-x:hidden;}
  ::selection{background:var(--red);color:#fff;}
  .display{font-family:'Anton',sans-serif;text-transform:uppercase;color:var(--red);letter-spacing:-.01em;line-height:.86;}
  .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);}

  nav{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:28px 6vw;}
  nav .name{font-size:13px;letter-spacing:.1em;text-transform:uppercase;}
  nav ul{list-style:none;display:flex;gap:26px;}
  nav a{color:var(--white);text-decoration:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;}
  nav a:hover{opacity:1;color:var(--red);}

  .hero{position:relative;height:100vh;min-height:640px;display:flex;align-items:flex-end;overflow:hidden;}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.4) brightness(.75) contrast(1.05);}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(10,10,9,.15) 0%, rgba(10,10,9,.85) 92%);}
  .hero h1{position:relative;z-index:2;font-size:clamp(64px,13vw,180px);padding:0 6vw 60px;}

  .services{padding:80px 6vw 100px;display:grid;grid-template-columns:1fr 1fr;gap:60px;}
  .service{border-top:1px solid var(--line);padding-top:22px;}
  .service .label{color:var(--red);margin-bottom:10px;}
  .service h3{font-size:22px;font-weight:600;margin-bottom:14px;letter-spacing:.02em;}
  .service p{font-size:13px;line-height:1.7;color:var(--grey);max-width:44ch;margin-bottom:22px;}
  .service .price-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.05em;}
  .service .price-row a{color:var(--white);text-decoration:none;font-size:16px;transition:color .2s, transform .2s;display:inline-block;}
  .service .price-row a:hover{color:var(--red);transform:translate(3px,-3px);}

  .strip-wrap{padding:20px 0 110px;overflow-x:auto;overflow-y:visible;scrollbar-width:none;}
  .strip-wrap::-webkit-scrollbar{display:none;}
  .strip{display:flex;gap:0;padding:40px 6vw;width:max-content;}
  .strip figure{width:220px;height:300px;flex:0 0 auto;margin-right:-18px;border:6px solid var(--bg);box-shadow:0 20px 40px rgba(0,0,0,.5);transition:transform .35s ease, z-index 0s;position:relative;}
  .strip figure:nth-child(5n+1){transform:rotate(-6deg);}
  .strip figure:nth-child(5n+2){transform:rotate(4deg) translateY(18px);}
  .strip figure:nth-child(5n+3){transform:rotate(-3deg) translateY(-14px);width:260px;height:340px;}
  .strip figure:nth-child(5n+4){transform:rotate(5deg) translateY(10px);}
  .strip figure:nth-child(5n+5){transform:rotate(-5deg) translateY(-6px);}
  .strip figure:hover{transform:rotate(0deg) translateY(-10px) scale(1.05);z-index:5;}
  .strip img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.25) contrast(1.05);}

  .faq{padding:60px 6vw 100px;}
  .faq h2{font-size:clamp(48px,8vw,110px);margin-bottom:50px;}
  .faq-item{border-top:1px solid var(--line);}
  .faq-item:last-child{border-bottom:1px solid var(--line);}
  .faq-q{display:grid;grid-template-columns:60px 1fr 24px;align-items:center;gap:20px;padding:22px 0;cursor:pointer;background:none;border:none;width:100%;text-align:left;color:var(--white);}
  .faq-q .num{font-size:12px;color:var(--grey);letter-spacing:.05em;}
  .faq-q .q-text{font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;}
  .faq-q .arrow{font-size:16px;color:var(--grey);transition:transform .3s ease;justify-self:end;}
  .faq-item.open .arrow{transform:rotate(180deg);color:var(--red);}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .4s ease;}
  .faq-item.open .faq-a{max-height:280px;}
  .faq-a-inner{display:grid;grid-template-columns:120px 1fr;gap:24px;padding:0 0 30px 60px;align-items:start;}
  .faq-a-inner img{width:120px;height:150px;object-fit:cover;filter:grayscale(.3);}
  .faq-a-inner p{font-size:13px;line-height:1.7;color:var(--grey);max-width:52ch;}

  footer{padding:70px 6vw 0;}
  .foot-top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px;border-top:1px solid var(--line);padding-top:26px;padding-bottom:60px;font-size:12px;color:var(--grey);}
  .foot-top a{color:var(--grey);text-decoration:none;display:block;margin-bottom:6px;}
  .foot-top a:hover{color:var(--red);}
  .foot-top .col-title{color:var(--white);margin-bottom:10px;letter-spacing:.05em;text-transform:uppercase;font-size:11px;}
  .foot-name{font-size:clamp(90px,20vw,260px);line-height:.8;text-align:center;-webkit-text-stroke:1.5px var(--red);color:transparent;overflow:hidden;height:.62em;letter-spacing:-.02em;}

  @media (max-width:820px){
    nav ul{display:none;}
    .services{grid-template-columns:1fr;}
    .foot-top{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>

<nav>
  <div class="name" id="nav-name">—</div>
  <ul>
    <li><a href="#services">Services</a></li>
    <li><a href="#work">Work</a></li>
    <li><a href="#faq">FAQ</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<section class="hero" id="hero">
  <img id="hero-img" src="" alt="">
  <h1 class="display">Services</h1>
</section>

<section class="services" id="services-list"></section>

<div class="strip-wrap" id="work">
  <div class="strip" id="gallery-strip"></div>
</div>

<section class="faq" id="faq">
  <h2 class="display">FAQ</h2>
  <div id="faq-list"></div>
</section>

<footer id="contact">
  <div class="foot-top">
    <div>
      <div class="col-title">Menu</div>
      <a href="#work">Portfolio</a>
      <a href="#services">About</a>
      <a href="#faq">Info</a>
    </div>
    <div>
      <div class="col-title">Contact</div>
      <p id="contact-text"></p>
    </div>
    <div style="text-align:right">
      <div class="col-title">Social</div>
      <a id="ig-link" target="_blank">Instagram</a>
      <a id="fb-link" target="_blank">Facebook</a>
    </div>
  </div>
  <div class="foot-name display" id="footer-name">—</div>
</footer>

<script>
  fetch('./content.json?_=' + Date.now())
    .then(r => r.json())
    .then(data => {
      document.getElementById('nav-name').textContent = data.name;
      document.getElementById('footer-name').textContent = data.name;
      document.getElementById('hero-img').src = data.hero_image;

      const servicesEl = document.getElementById('services-list');
      data.services.forEach(s => {
        servicesEl.insertAdjacentHTML('beforeend', `
          <div class="service">
            <div class="label">${s.label}</div>
            <h3>${s.title}</h3>
            <p>${s.description}</p>
            <div class="price-row"><span>${s.price}</span><a href="#contact">↗</a></div>
          </div>`);
      });

      const galleryEl = document.getElementById('gallery-strip');
      data.gallery.forEach(url => {
        galleryEl.insertAdjacentHTML('beforeend', `<figure><img src="${url}" alt=""></figure>`);
      });

      const faqEl = document.getElementById('faq-list');
      data.faq.forEach((item, i) => {
        const num = String(i + 1).padStart(2, '0');
        faqEl.insertAdjacentHTML('beforeend', `
          <div class="faq-item">
            <button class="faq-q"><span class="num">/${num}</span><span class="q-text">${item.question}</span><span class="arrow">↓</span></button>
            <div class="faq-a"><div class="faq-a-inner">
              <img src="${item.image}" alt="">
              <p>${item.answer}</p>
            </div></div>
          </div>`);
      });

      document.querySelectorAll('.faq-item').forEach(item => {
        item.querySelector('.faq-q').addEventListener('click', () => {
          const isOpen = item.classList.contains('open');
          document.querySelectorAll('.faq-item').forEach(i => {
            i.classList.remove('open');
            i.querySelector('.arrow').textContent = '↓';
          });
          if (!isOpen) {
            item.classList.add('open');
            item.querySelector('.arrow').textContent = '↑';
          }
        });
      });

      document.getElementById('contact-text').textContent = data.contact_text;
      document.getElementById('ig-link').href = data.instagram_url;
      document.getElementById('fb-link').href = data.facebook_url;
    });

  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
      }
    });
  }
</script>

</body>
</html>

    position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;
    background:rgba(10,10,9,.7);display:flex;align-items:center;justify-content:center;

<body>

<nav>
  <div class="name" id="nav-name">—</div>
  <ul>
    <li><a href="#services">Services</a></li>
    <li><a href="#work">Work</a></li>
    <li><a href="#faq">FAQ</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<section class="hero" id="hero"></section>

<section class="services" id="services-list"></section>

<div class="strip-wrap" id="work">
  <div class="strip" id="gallery-strip"></div>
</div>

<section class="faq" id="faq">
  <h2 class="display reveal">FAQ</h2>
  <div id="faq-list"></div>
</section>

<footer id="contact">
  <div class="foot-top">
    <div>
      <div class="col-title">Menu</div>
      <a href="#work">Portfolio</a>
      <a href="#services">About</a>
      <a href="#faq">Info</a>
    </div>
    <div>
      <div class="col-title">Contact</div>
      <p id="contact-text"></p>
    </div>
    <div style="text-align:right">
      <div class="col-title">Social</div>
      <a id="ig-link" target="_blank">Instagram</a>
      <a id="fb-link" target="_blank">Facebook</a>
    </div>
  </div>
  <div class="foot-name display" id="footer-name">—</div>
</footer>

<script>
  // определяем видео по расширению файла
  function isVideo(url){
    return /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(url || '');
  }

  fetch('./content.json?_=' + Date.now())
    .then(r => r.json())
    .then(data => {
      document.getElementById('nav-name').textContent = data.name;
      document.getElementById('footer-name').textContent = data.name;

      // hero: видео, если указано hero_video, иначе фото
      const heroEl = document.getElementById('hero');
      const heroMediaTag = data.hero_video
        ? `<video autoplay muted loop playsinline src="${data.hero_video}"></video>`
        : `<img src="${data.hero_image}" alt="">`;
      heroEl.insertAdjacentHTML('afterbegin', heroMediaTag + `<h1 class="display">Services</h1>`);

      const servicesEl = document.getElementById('services-list');
      data.services.forEach(s => {
        servicesEl.insertAdjacentHTML('beforeend', `
          <div class="service reveal">
            <div class="label">${s.label}</div>
            <h3>${s.title}</h3>
            <p>${s.description}</p>
            <div class="price-row"><span>${s.price}</span><a href="#contact">↗</a></div>
          </div>`);
      });

      // галерея: фото или видео вперемешку, по расширению файла
      const galleryEl = document.getElementById('gallery-strip');
      data.gallery.forEach(url => {
        if (isVideo(url)) {
          galleryEl.insertAdjacentHTML('beforeend',
            `<figure class="reveal"><video autoplay muted loop playsinline src="${url}"></video><span class="play-badge">▶</span></figure>`);
        } else {
          galleryEl.insertAdjacentHTML('beforeend',
            `<figure class="reveal"><img src="${url}" alt=""></figure>`);
        }
      });

      const faqEl = document.getElementById('faq-list');
      data.faq.forEach((item, i) => {
        const num = String(i + 1).padStart(2, '0');
        faqEl.insertAdjacentHTML('beforeend', `
          <div class="faq-item reveal">
            <button class="faq-q"><span class="num">/${num}</span><span class="q-text">${item.question}</span><span class="arrow">↓</span></button>
            <div class="faq-a"><div class="faq-a-inner">
              <img src="${item.image}" alt="">
              <p>${item.answer}</p>
            </div></div>
          </div>`);
      });

      document.querySelectorAll('.faq-item').forEach(item => {
        item.querySelector('.faq-q').addEventListener('click', () => {
          const isOpen = item.classList.contains('open');
          document.querySelectorAll('.faq-item').forEach(i => {
            i.classList.remove('open');
            i.querySelector('.arrow').textContent = '↓';
          });
          if (!isOpen) {
            item.classList.add('open');
            item.querySelector('.arrow').textContent = '↑';
          }
        });
      });

      document.getElementById('contact-text').textContent = data.contact_text;
      document.getElementById('ig-link').href = data.instagram_url;
      document.getElementById('fb-link').href = data.facebook_url;

      // запускаем анимацию появления после того, как контент собран
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });
      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    });

  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
      }
    });
  }
</script>

</body>
</html>
